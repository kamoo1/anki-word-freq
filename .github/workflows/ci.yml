name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_tag.outputs.should_build }}
      tag: ${{ steps.check_tag.outputs.tag }}
      version: ${{ steps.check_tag.outputs.version }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==1.8.2
        poetry sync --only ci
    - name: Check if version already tagged
      id: check_tag
      # semantic_release version command creates `tag` & `version` output
      run: |
        VERSION=$(python -m semantic_release version --print)
        TAG="v$VERSION"
        echo "Checking for tag: $TAG"

        if git tag -l | grep -q "^${TAG}$"; then
          echo "Tag $TAG already exists."
          echo "should_build=false" >> $GITHUB_OUTPUT
        else
          echo "Tag $TAG not found."
          echo "should_build=true" >> $GITHUB_OUTPUT
        fi

  build:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' && 
      needs.check-version.outputs.should_build == 'true'
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==1.8.2
    - name: Build Artifacts
      env:
        TAG: ${{ needs.check-version.outputs.tag }}
        VERSION: ${{ needs.check-version.outputs.version }}
      run: |
        # this command also updates version in `pyproject.toml` and `__init__.py`
        # so we'll have the next version reflected in the built artifacts
        VERSION_ACTUAL=$(python -m semantic_release version --no-commit --no-push --skip-build --no-vcs-release)
        if [ "$VERSION_ACTUAL" != "$VERSION" ]; then
          echo "Version mismatch: expected $VERSION, got $VERSION_ACTUAL"
          exit 1
        fi
        poetry sync
        poetry run make
        poetry sync --with cjk
        poetry run make cjk
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.python-version }}
        path: dist/*.ankiaddon
        if-no-files-found: error

  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT }}
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: ./dist
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==1.8.2
        poetry sync --only ci
    # to bypass protected branch rules:
    # https://python-semantic-release.readthedocs.io/en/latest/automatic-releases/github-actions.html#example-workflow (warnings section)
    # https://github.com/python-semantic-release/python-semantic-release/issues/311
    - name: semantic-release
      run: |
        python -m semantic_release version
        python -m semantic_release publish
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

  tag-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [check-version, semantic-release]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' && 
      (
        needs.check-version.outputs.should_build == 'false' || 
        needs.semantic-release.result == 'success'
      )
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Run latest-tag
      uses: EndBug/latest-tag@v1.5.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
